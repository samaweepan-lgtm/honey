<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>น้ำผึ้งแท้ธรรมชาติ | Golden Hive</title>
<style>
:root{--g:#e8a317;--d:#4a320b;--bg:#fffaf0}
*{box-sizing:border-box}body{margin:0;font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--d)}
header{text-align:center;padding:64px 20px;background:linear-gradient(#ffe8a8,var(--bg))}
h1{font-size:2.4rem;margin:0 0 8px}.wrap{max-width:960px;margin:auto;padding:24px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px #0001}
.card img{width:100%;border-radius:12px}.price{font-size:1.4rem;color:#b87500;font-weight:700}
button,.btn{background:var(--g);border:0;color:#fff;padding:12px 20px;border-radius:10px;font-size:1rem;cursor:pointer}
form{display:grid;gap:12px;background:#fff;padding:20px;border-radius:16px}
input,select,textarea{padding:10px;border:1px solid #ddd;border-radius:8px;font:inherit;width:100%}
#msg{font-weight:700;margin-top:10px}
</style></head><body>
<header><h1>🍯 Golden Hive น้ำผึ้งแท้ 100%</h1><p>ไม่ผสมน้ำตาล เก็บตรงจากฟาร์ม ส่งทั่วไทย</p><a class="btn" href="#order">สั่งซื้อเลย</a></header>
<div class="wrap"><h2>สินค้าของเรา</h2><div class="grid" id="products"></div>
<h2 id="order">สั่งซื้อ</h2>
<form id="f">
<select name="sku" id="sku" required></select>
<input name="qty" id="qty" type="number" min="1" value="1" required>
<input name="name" placeholder="ชื่อ-นามสกุลผู้รับ" required>
<input name="phone" placeholder="เบอร์โทร" pattern="[0-9]{9,10}" required>
<textarea name="address" rows="3" placeholder="ที่อยู่จัดส่ง (รวมรหัสไปรษณีย์)" required></textarea>
<div>ยอดรวม: <b id="total">0</b> บาท</div>
<button>ยืนยันการสั่งซื้อ</button><div id="msg"></div></form></div>
<script>
// ใส่ URL ของ Apps Script Web App หลัง Deploy
const API_URL="PASTE_APPS_SCRIPT_URL_HERE";
const PRODUCTS=[
{sku:"HN-WILD-500",name:"น้ำผึ้งดอกไม้ป่า 500 กรัม",price:250,weight:"500 g",img:"images/honey-wildflower.svg"},
{sku:"HN-LONGAN-500",name:"น้ำผึ้งดอกลำไย 500 กรัม",price:280,weight:"500 g",img:"images/honey-longan.svg"}];
const $=id=>document.getElementById(id);
$("products").innerHTML=PRODUCTS.map(p=>`<div class="card"><img src="${p.img}" alt="${p.name}"><h3>${p.name}</h3><div>SKU: ${p.sku}</div><div class="price">${p.price} บาท</div></div>`).join("");
$("sku").innerHTML=PRODUCTS.map(p=>`<option value="${p.sku}">${p.name} - ${p.price} บาท</option>`).join("");
const cur=()=>PRODUCTS.find(p=>p.sku===$("sku").value);
const calc=()=>$("total").textContent=cur().price*(+$("qty").value||0);
$("sku").onchange=$("qty").oninput=calc;calc();
$("f").onsubmit=async e=>{e.preventDefault();const p=cur(),fd=Object.fromEntries(new FormData(e.target));
const body={...fd,product:p.name,qty:+fd.qty,total:p.price*fd.qty};
$("msg").textContent="กำลังส่งคำสั่งซื้อ...";
try{const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(body)});const j=await r.json();
$("msg").textContent=j.ok?"✅ สั่งซื้อสำเร็จ เลขที่ออเดอร์ "+j.id:"เกิดข้อผิดพลาด";if(j.ok)e.target.reset();calc();}
catch(err){$("msg").textContent="ส่งไม่สำเร็จ กรุณาลองใหม่";}};
</script></body></html>
